<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>FreelanceBuddy — SG Renewal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ios-blue:#007aff;--ios-blue-lt:#e8f3ff;
      --ios-green:#34c759;--ios-green-lt:#e8fbed;
      --ios-red:#ff3b30;--ios-red-lt:#fff1f0;
      --ios-orange:#ff9500;--ios-orange-lt:#fff4e5;
      --ios-gray:#8e8e93;
      --text:#000000;
      --radius-lg:22px;--radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter','Hind Siliguri',sans-serif;
      background:#f2f2f7;min-height:100vh;min-height:100dvh;
      display:flex;align-items:center;justify-content:center;
      padding:24px 20px;-webkit-font-smoothing:antialiased;
    }
    .card{
      width:100%;max-width:380px;background:#fff;
      border-radius:var(--radius-lg);padding:28px 22px;
      box-shadow:0 4px 24px rgba(0,0,0,0.08);
      text-align:center;
    }
    .brand{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:20px;}
    .brand span{color:var(--ios-blue);}
    .icon{font-size:42px;margin-bottom:12px;}
    .title{font-size:17px;font-weight:800;color:var(--ios-red);margin-bottom:10px;line-height:1.4;}
    .body{font-size:14px;color:#555;line-height:1.9;margin-bottom:24px;}
    .body b{font-weight:700;color:#222;}
    .btn{
      width:100%;padding:17px;background:var(--ios-green);
      color:white;border:none;border-radius:var(--radius-lg);
      font-size:16px;font-weight:700;
      font-family:'Hind Siliguri','Inter',sans-serif;
      cursor:pointer;box-shadow:0 4px 16px rgba(52,199,89,0.3);
    }
    .btn:active{opacity:0.8;}
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Freelance<span>Buddy</span></div>
  <div class="icon">🚫</div>
  <div class="title">SG Telegram Temporarily Stopped</div>
  <div class="body">
    Alert পেতে আমাদের <b>FBuddy SG Alert App</b>-এ renew করুন।<br>
    Play Store link পেতে WhatsApp করুন।
  </div>
  <button class="btn" onclick="openWA()">📲 WhatsApp করুন</button>
</div>
<script>
  function openWA() {
    var msg = "হ্যালো! FBuddy SG Alert App-এর Play Store link চাই।";
    var url = "https://wa.me/916294146285?text=" + encodeURIComponent(msg);
    var w = window.open(url, "_blank");
    if (!w||w.closed||typeof w.closed==="undefined") window.location.href = url;
  }
</script>
</body>
</html>
